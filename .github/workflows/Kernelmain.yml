name: Build mido nethunter 4.9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Clean repo
      run: |
        rm -rf builder .git/modules/builder .gitmodules || true
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc cpio flex bison libssl-dev python-is-python3 libelf-dev build-essential
    - name: Get ZyC Clang 16
      run: |
        mkdir clang && cd clang
        curl -L -o clang.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -xzf clang.tar.gz
        echo "$(pwd)/bin" >> $GITHUB_PATH
        cd ..
        ls clang/bin/clang -l
    - name: Get AnyKernel3
      run: git clone https://github.com/osm0sis/AnyKernel3.git builder
    - name: Build kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export KBUILD_BUILD_USER=builder
        export KBUILD_BUILD_HOST=mido
        clang --version
        chmod +x build.sh
        ./build.sh mido
    - name: Upload zip
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mido-nethunter-4.9
        path: |
          *.zip
          out/*.zip
          builder/*.zip
          build.log

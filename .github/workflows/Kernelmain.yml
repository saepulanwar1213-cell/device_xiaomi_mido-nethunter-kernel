name: Build mido nethunter 4.9 v4
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Deps
      run: |
        rm -rf builder .git/modules 2>/dev/null; rm -f .gitmodules || true
        sudo apt update && sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential python-is-python3
    - name: Clang
      run: |
        mkdir clang && cd clang
        curl -L -o c.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -xzf c.tar.gz
        echo "$PWD/bin" >> $GITHUB_PATH
    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        DEF=$(ls arch/arm64/configs/*mido* | head -n1 | xargs basename)
        echo "DEF=$DEF"
        make $DEF
        make -j$(nproc) Image.gz dtbs || make -j$(nproc) Image.gz-dtb
        ls -lh arch/arm64/boot/
    - name: Make REAL flashable zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3 --depth=1
        # cari image yang bener
        KIMG=$(find arch/arm64/boot -name "Image.gz*" | head -n1)
        echo "Found $KIMG"
        ls -lh $KIMG
        cp $KIMG AnyKernel3/
        # kalau Image.gz-dtb, rename jadi Image.gz
        cd AnyKernel3
        if [ -f Image.gz-dtb ]; then mv Image.gz-dtb Image.gz; fi
        if [ -f Image.gz-dtb ]; then mv Image.gz-dtb Image.gz; fi
        # rename biar OrangeFox kenal
        ls -lh
        zip -r9 ../mido-nethunter-4.9-LOS21-FLASHABLE.zip * -x .git/*
        cd ..
        ls -lh *.zip
        unzip -l *.zip | head -n 50
    - uses: actions/upload-artifact@v4
      with:
        name: mido-nethunter-FLASHABLE
        path: "*-FLASHABLE.zip"

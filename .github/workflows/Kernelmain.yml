name: Build mido v5 fix
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Deps
      run: |
        rm -rf builder .git/modules 2>/dev/null; rm -f .gitmodules || true
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential python3
    - name: Clang
      run: |
        mkdir clang
        cd clang
        curl -L -o c.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -xzf c.tar.gz
        echo "$PWD/bin" >> $GITHUB_PATH
        cd ..
    - name: Build
      run: |
        export ARCH=arm64
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        ls arch/arm64/configs/ | grep mido
        DEF=$(ls arch/arm64/configs/ | grep mido | head -n1)
        echo "Using $DEF"
        make ${DEF}
        make -j$(nproc) Image.gz dtbs || make -j$(nproc) Image.gz-dtb
        ls -lh arch/arm64/boot/
    - name: Pack
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AK3 --depth=1
        KIMG=$(find arch/arm64/boot -name "Image.gz*" | head -n1)
        echo "KIMG $KIMG"
        cp $KIMG AK3/
        cd AK3
        if [ -f Image.gz-dtb ]; then mv Image.gz-dtb Image.gz; fi
        sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
        zip -r9 ../mido-nethunter-LOS21-FIXED.zip * -x .git/*
        cd ..
        ls -lh *.zip
    - uses: actions/upload-artifact@v4
      with:
        name: mido-nethunter-FIXED
        path: "*-FIXED.zip"

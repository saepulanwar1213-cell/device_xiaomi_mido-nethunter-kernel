name: Build mido nethunter 4.9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
    - name: Clean bad submodule
      run: |
        rm -rf .git/modules/builder || true
        git rm -f builder || true
        rm -rf builder || true
        rm -f .gitmodules || true
    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y bc cpio flex bison libssl-dev python-is-python3 zstd wget git zip
    - name: Get Clang
      run: |
        mkdir -p clang
        cd clang
        wget -q https://github.com/Neutron-Toolchains/antman/releases/download/230323/neutron-clang-230323.tar.zst -O clang.tar.zst
        tar -I zstd -xf clang.tar.zst
        echo "$(pwd)/bin" >> $GITHUB_PATH
        cd ..
        ls clang/bin/
    - name: Get AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git builder
    - name: Build
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        clang --version
        ls -la
        chmod +x build.sh
        bash build.sh mido
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: mido-nethunter-4.9
        path: |
          out/*.zip
          *.zip

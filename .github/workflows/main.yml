name: Build mido nethunter 4.9
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install deps
      run: sudo apt update && sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential python-is-python3
    - name: Get Clang 16
      run: |
        mkdir clang && cd clang
        curl -L -o clang.tar.gz https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -xzf clang.tar.gz
        echo "$PWD/bin" >> $GITHUB_PATH
        cd ..
    - name: Build direct make
      run: |
        export ARCH=arm64
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        make mido_defconfig
        # enable rtl8188eu and nethunter configs
        ./scripts/config --enable CONFIG_RTL8188EU || true
        ./scripts/config --enable CONFIG_WLAN || true
        make -j$(nproc) Image.gz dtbs
        ls arch/arm64/boot/
    - name: Make AnyKernel3 zip
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
        cp arch/arm64/boot/Image.gz AnyKernel/
        cp arch/arm64/boot/dts/qcom/msm8953*.dtb AnyKernel/ 2>/dev/null || cp arch/arm64/boot/dts/*.dtb AnyKernel/ 2>/dev/null || true
        cd AnyKernel
        zip -r9 ../mido-nethunter-4.9-LOS21-rtl8188eu.zip *
        cd ..
        ls -lh *.zip
    - uses: actions/upload-artifact@v4
      with:
        name: mido-nethunter-4.9
        path: "*.zip"
